# Experience
experience.title: "Uzoefu"
experience.subtitle: "Safari yangu ya kitaaluma"

experience.1.role: "Mtengenezaji Wavuti Msaidizi"
experience.1.company: "Software Lounge Ltd"
experience.1.period: "Mei 2025 — Julai 2025"
experience.1.description: "Utengenezaji wa fomu ya wavuti ya kisasa kwa kutumia mfumo wa Symfony (PHP). Utekelezaji wa mfumo wa kutuma barua pepe kiotomatiki kwa uthibitisho wa mteja na arifa ya kampuni baada ya kuwasilisha fomu. Kazi ya kuunganisha mbele/nyuma na uthibitishaji wa data."

experience.2.role: "Mratibu wa Wateja na Watoa Huduma"
experience.2.company: "E-Volve Solution Ltd"
experience.2.period: "Februari 2022 — Septemba 2025"
experience.2.type: "(Zamu ya usiku)"
experience.2.description: "Uchambuzi wa mahitaji ya wateja na kupeleka kwa idara husika kufuatia taratibu. Kurekodi taarifa za simu katika zana ya CRM. Kuripoti upotoshaji na malalamiko kwa msimamizi. Kushughulikia arifa za usimamizi na matangazo ya matengenezo."

experience.3.role: "Mpelelezi wa Simu"
experience.3.company: "BVA Datacall"
experience.3.period: "Septemba 2022 — Oktoba 2022"
experience.3.description: "Kufanya uchunguzi wa simu kwa msaada wa kompyuta kukusanya data za masoko, faili za wateja watarajiwa na tafiti za kuridhika."

experience.4.role: "Mdhibiti wa Forodha (Mafunzo)"
experience.4.company: "DGDA / DRC"
experience.4.period: "Novemba 2018 — Desemba 2018"
experience.4.description: "Udhibiti na ulinzi wa bidhaa zinazosogea na njia za usafiri kwenye vituo vya ukaguzi vya barabara kuu."

